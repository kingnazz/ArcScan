name: Fix v1.8.5 npm audit

on:
  push:
    branches: ["release/v1.8.5"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.8.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only
      - name: Verify high-severity audit is clean
        run: npm audit --audit-level=high
      - name: Commit lockfile fixes
        shell: bash
        run: |
          if git diff --quiet package-lock.json; then
            echo "No lockfile changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update audited npm lockfile dependencies"
          git push origin HEAD:release/v1.8.5
