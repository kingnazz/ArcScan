name: Fix ArcAtlas toolbar

on:
  push:
    branches:
      - fix/arcatlas-toolbar

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arcatlas-toolbar
      - name: Remove redundant ArcAtlas toolbar control
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/components/InventoryPanel.tsx",
              '''              <Button size="sm" onClick={props.onManageArcAtlas} title="ArcAtlas connection">\n                ArcAtlas\n              </Button>\n''',
              "",
          )

          replace_once(
              "src/components/ArcAtlasDialog.tsx",
              '''  onReconnect: () => void;\n  onSend: () => Promise<void> | void;\n''',
              '''  onReconnect: () => void;\n  onManageConnection?: () => void;\n  onSend: () => Promise<void> | void;\n''',
          )

          replace_once(
              "src/components/ArcAtlasDialog.tsx",
              '''            <div className="mt-4 flex justify-end gap-2">\n              <Button type="button" onClick={props.onClose}>\n                Cancel\n              </Button>\n              <Button type="button" variant="primary" disabled={props.busy} onClick={() => void props.onSend()}>\n''',
              '''            <div className="mt-4 flex justify-end gap-2">\n              {props.onManageConnection ? (\n                <Button type="button" onClick={props.onManageConnection}>\n                  Connection\n                </Button>\n              ) : null}\n              <Button type="button" onClick={props.onClose}>\n                Cancel\n              </Button>\n              <Button type="button" variant="primary" disabled={props.busy} onClick={() => void props.onSend()}>\n''',
          )

          replace_once(
              "src/App.tsx",
              '''        onReconnect={() => {\n          setArcAtlasError(null);\n          setArcAtlasMode("connect");\n          setArcAtlasOpen(true);\n        }}\n        onSend={sendToArcAtlas}\n''',
              '''        onReconnect={() => {\n          setArcAtlasError(null);\n          setArcAtlasMode("connect");\n          setArcAtlasOpen(true);\n        }}\n        onManageConnection={openArcAtlasManage}\n        onSend={sendToArcAtlas}\n''',
          )
          PY
      - name: Verify patch
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/InventoryPanel.tsx src/components/ArcAtlasDialog.tsx src/App.tsx
          git commit -m "fix: simplify ArcAtlas inventory action"
          git push origin HEAD:fix/arcatlas-toolbar
