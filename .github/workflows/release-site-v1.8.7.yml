name: One-shot v1.8.7 release site sync

on:
  push:
    branches:
      - release/v1.8.7

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Add the v1.8.7 release page and update release-site metadata
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          index_path = Path('site/index.html')
          index = index_path.read_text()
          start_marker = '      <!-- ====================================================== new in 1.8.6 -->\n'
          end_marker = '      <section class="section" id="download">'
          start = index.index(start_marker)
          end = index.index(end_marker, start)
          release_section = '''      <!-- ====================================================== new in 1.8.7 -->
          <section class="section" id="whats-new">
            <div class="wrap">
              <div class="section-head">
                <p class="eyebrow">New in 1.8.7</p>
                <h2>Cleaner ArcAtlas handoffs from current scans.</h2>
                <p>
                  ArcScan now sends only devices the latest compatible scan actually found to ArcAtlas.
                  Missing and unknown historical inventory stays available in ArcScan without being treated
                  as current discovery evidence. Hostname persistence and infrastructure classification are
                  also more resilient.
                  <a id="release-notes-link" href="whats-new-1.8.7.html">What&rsquo;s new in 1.8.7</a>
                </p>
              </div>

              <div class="whats-new">
                <article>
                  <h3>Current devices only</h3>
                  <p>
                    Send to ArcAtlas now includes only inventory rows marked present by the latest compatible
                    scan, so historical devices do not enter the normal discovery candidate set.
                  </p>
                </article>

                <article>
                  <h3>History stays visible, not actionable</h3>
                  <p>
                    Missing and unknown devices remain in ArcScan Inventory for context and history, while the
                    send confirmation reports that those historical rows were excluded from the handoff.
                  </p>
                </article>

                <article>
                  <h3>Stronger identity evidence</h3>
                  <p>
                    Blank later observations no longer erase a durable hostname, and family identity for
                    common Synology, Ubiquiti and Dell infrastructure takes precedence over incidental services.
                  </p>
                </article>
              </div>
            </div>
          </section>

'''
          index = index[:start] + release_section + index[end:]
          index_path.write_text(index)

          release_page = '''<!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>What's new in ArcScan 1.8.7</title>
              <meta name="description" content="ArcScan 1.8.7 makes the ArcAtlas handoff current-only, keeps historical devices out of discovery actions, repairs durable hostnames, and strengthens infrastructure classification." />
              <link rel="canonical" href="https://kingnazz.github.io/ArcScan/whats-new-1.8.7.html" />
              <link rel="icon" href="assets/favicon.png" />
              <meta name="color-scheme" content="dark" />
              <meta name="theme-color" content="#000000" />
              <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; connect-src 'self'; base-uri 'none'; form-action 'none'" />
              <link rel="stylesheet" href="arcscan.v5.css" />
            </head>
            <body>
              <a class="skip-link" href="#main">Skip to content</a>
              <header class="nav">
                <div class="nav-inner">
                  <a class="brand" href="./"><img src="assets/logo.png" width="24" height="24" alt="" /><span>ArcScan</span></a>
                  <nav aria-label="Primary"><ul class="nav-links"><li><a href="./#features">Features</a></li><li><a href="./#download">Download</a></li><li><a href="privacy.html">Privacy</a></li><li><a href="https://github.com/kingnazz/ArcScan" rel="noopener">GitHub</a></li></ul></nav>
                </div>
              </header>
              <main id="main" class="section">
                <div class="wrap prose">
                  <p class="eyebrow">ArcScan 1.8.7</p>
                  <h1 class="page-title">ArcAtlas handoff only sends what the latest scan actually found.</h1>
                  <p class="lede">
                    1.8.7 aligns ArcScan with ArcAtlasNext's presence-aware import workflow. A network inventory can
                    still remember devices that disappeared or whose current presence is unknown, but those historical
                    rows are no longer sent as if the newest scan discovered them.
                  </p>

                  <h2>Present means actionable</h2>
                  <p>
                    Send to ArcAtlas now filters the selected network to rows whose current presence is
                    <strong>present</strong>. The confirmation tells you how many present devices will be sent and how
                    many missing or unknown historical devices were excluded.
                  </p>

                  <h2>Historical inventory stays useful</h2>
                  <p>
                    ArcScan still keeps missing and unknown devices in Inventory and history. This release changes the
                    handoff boundary, not the historical record. You can still investigate what used to be on the network
                    without turning that evidence into a current ArcAtlas discovery candidate.
                  </p>

                  <h2>Durable hostnames survive blank observations</h2>
                  <p>
                    A later observation with an empty or whitespace hostname is normalized to no hostname instead of
                    replacing a useful name already learned for the device. Existing databases also repair blank durable
                    hostnames from the newest recorded nonblank observation when one exists. Operator custom names remain
                    untouched and continue to win in the interface.
                  </p>

                  <h2>Infrastructure identity wins over incidental services</h2>
                  <p>
                    Strong manufacturer and model-family evidence for common Synology NAS, Ubiquiti gateway, switch and
                    access-point families, and Dell PowerEdge or iDRAC systems now takes precedence over generic service
                    clues. Conflicting service evidence remains visible instead of being discarded.
                  </p>

                  <div class="notice">
                    <div>
                      <h3>Built for the ArcAtlasNext presence workflow</h3>
                      <p>
                        Use ArcScan 1.8.7 or newer for the first production ArcScan to ArcAtlasNext test. It keeps the
                        desktop inventory historical while making the outbound discovery handoff represent the latest
                        compatible scan.
                      </p>
                    </div>
                  </div>

                  <div class="cta-row">
                    <a class="btn btn-primary" href="./#download">Download ArcScan</a>
                    <a class="btn btn-secondary" href="https://github.com/kingnazz/ArcScan/releases" rel="noopener">Release history</a>
                  </div>
                </div>
              </main>
              <footer class="footer"><div class="wrap"><p class="footer-note">ArcScan is free and open source under the MIT license. Scan only networks you own or are authorised to inspect.</p></div></footer>
            </body>
          </html>
          '''
          # Remove indentation introduced by the Python source so the generated HTML is clean.
          lines = release_page.splitlines()
          release_page = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('site/whats-new-1.8.7.html').write_text(release_page)

          sitemap_path = Path('site/sitemap.xml')
          sitemap = sitemap_path.read_text()
          sitemap = sitemap.replace('<lastmod>2026-09-14</lastmod>', '<lastmod>2026-09-16</lastmod>', 1)
          anchor = '''  <url>\n    <loc>https://kingnazz.github.io/ArcScan/whats-new-1.8.6.html</loc>'''
          new_entry = '''  <url>\n    <loc>https://kingnazz.github.io/ArcScan/whats-new-1.8.7.html</loc>\n    <lastmod>2026-09-16</lastmod>\n    <changefreq>yearly</changefreq>\n    <priority>0.8</priority>\n  </url>\n'''
          sitemap = sitemap.replace(anchor, new_entry + anchor, 1)
          sitemap_path.write_text(sitemap)

          verify_path = Path('scripts/verify-site.mjs')
          verify = verify_path.read_text()
          old_block_start = 'await step("the release section states the 1.8.6 improvements", async () => {'
          old_block_end = 'await step("the What changed link opens the local 1.8.6 page", async () => {'
          a = verify.index(old_block_start)
          b = verify.index(old_block_end, a)
          new_block = '''await step("the release section states the 1.8.7 improvements", async () => {
            const section = page.locator("#whats-new");
            await section.waitFor({ timeout: 3000 });
            const text = (await section.innerText()).toLowerCase();

            if (!text.includes("1.8.7")) throw new Error("the section does not name the version");

            const claims = [
              [/present|current devices only/, "current-only ArcAtlas handoff"],
              [/missing.*unknown|historical/, "historical rows excluded from handoff"],
              [/hostname|identity evidence|synology|ubiquiti|dell/, "stronger durable identity evidence"],
            ];
            for (const [pattern, label] of claims) {
              if (!pattern.test(text)) throw new Error(`missing ${label}`);
            }

            const headings = await section.locator("h3").allInnerTexts();
            if (headings.length !== 3) throw new Error(`expected 3 improvements, got ${headings.length}`);
            return headings.map((h) => h.trim()).join(", ");
          });

'''
          verify = verify[:a] + new_block + verify[b:]
          verify = verify.replace('the What changed link opens the local 1.8.6 page', 'the What changed link opens the local 1.8.7 page')
          verify = verify.replace('href !== "whats-new-1.8.6.html"', 'href !== "whats-new-1.8.7.html"')
          verify = verify.replace('"whats-new-1.8.6.html",\n    "whats-new-1.8.5.html",', '"whats-new-1.8.7.html",\n    "whats-new-1.8.6.html",\n    "whats-new-1.8.5.html",')
          verify = verify.replace('const currentWhatsNew = "/whats-new-1.8.6.html";', 'const currentWhatsNew = "/whats-new-1.8.7.html";')
          verify = verify.replace('/macOS LAN scans keep the devices they actually find/i', '/ArcAtlas handoff only sends what the latest scan actually found/i')
          verify = verify.replace('return "home and 1.8.6 release page link both ways";', 'return "home and 1.8.7 release page link both ways";')
          verify = verify.replace('{ label: "whats-new 1.8.6 desktop", path: "/whats-new-1.8.6.html", width: 1440, height: 900 },\n    { label: "whats-new 1.8.6 mobile", path: "/whats-new-1.8.6.html", width: 390, height: 844 },\n    // The previous release\'s page stays published, so it stays checked.\n    { label: "whats-new 1.8.5", path: "/whats-new-1.8.5.html", width: 1440, height: 900 },', '{ label: "whats-new 1.8.7 desktop", path: "/whats-new-1.8.7.html", width: 1440, height: 900 },\n    { label: "whats-new 1.8.7 mobile", path: "/whats-new-1.8.7.html", width: 390, height: 844 },\n    // The previous release\'s page stays published, so it stays checked.\n    { label: "whats-new 1.8.6", path: "/whats-new-1.8.6.html", width: 1440, height: 900 },')
          verify_path.write_text(verify)
          PY
      - name: Verify the marketing site
        run: |
          npm ci
          npm i --no-save playwright @axe-core/playwright
          npx playwright install chromium
          npx serve site -l 4174 > /dev/null 2>&1 &
          npx wait-on http://localhost:4174/ --timeout 60000
          npm run verify-site
      - name: Remove one-shot workflow
        run: rm .github/workflows/release-site-v1.8.7.yml
      - name: Commit release-site updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: publish ArcScan v1.8.7 release notes"
          git push
