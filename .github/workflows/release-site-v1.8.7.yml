name: One-shot v1.8.7 release site sync

on:
  push:
    branches:
      - release/v1.8.7

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Update release site
        run: python scripts/release-site-v1.8.7.py
      - name: Verify release site
        run: |
          npm ci
          npm i --no-save playwright @axe-core/playwright
          npx --yes playwright install --with-deps chromium
          npx --yes serve site -l 4174 > /dev/null 2>&1 &
          npx --yes wait-on http://localhost:4174/ --timeout 60000
          npm run verify-site
      - name: Remove one-shot files
        run: rm .github/workflows/release-site-v1.8.7.yml scripts/release-site-v1.8.7.py
      - name: Commit release-site updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: publish ArcScan v1.8.7 release notes"
          git push
