name: Build Windows ARM64 MSI

# Produces a native ARM64 (aarch64) MSI installer for Windows-on-ARM devices
# such as the Surface Pro X / Surface Pro 9 (SQ/SQ3) and Snapdragon Surfaces.
#
# We cross-compile from the x64 `windows-latest` runner because GitHub's
# hosted ARM64 Windows runners are not available on free minutes for private
# repos. `windows-latest` ships the "MSVC v143 ARM64 build tools", so the
# aarch64-pc-windows-msvc target links cleanly. (If you make the repo public
# or have larger runners, you can switch `runs-on` to `windows-11-arm` and
# drop the explicit --target for a native build.)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-arm64-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (ARM64 Windows target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build ARM64 installers (MSI + NSIS fallback)
        run: npm run tauri build -- --target aarch64-pc-windows-msvc --bundles msi nsis

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ArcScan-windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
