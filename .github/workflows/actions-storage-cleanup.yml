# Retain Actions artifacts for seven days. Does not delete GitHub releases.
name: Actions storage cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/actions-storage-cleanup.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 0'
permissions:
  actions: write
  contents: read
concurrency:
  group: actions-storage-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Remove Actions artifacts older than 7 days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 7 * 86400000;
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, per_page: 100
            });
            const stale = all.filter(a => !a.expired && Date.parse(a.created_at) < cutoff);
            let count = 0, bytes = 0;
            for (let i = 0; i < stale.length; i += 5) {
              await Promise.all(stale.slice(i, i + 5).map(async a => {
                try {
                  await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: a.id });
                  count++;
                  bytes += a.size_in_bytes || 0;
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
              }));
            }
            core.info(`Removed ${count} old artifacts (${(bytes/1024**3).toFixed(2)} GiB). GitHub release assets untouched.`);
