name: One-shot v1.8.7 version sync

on:
  push:
    branches:
      - release/v1.8.7

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Sync version-bearing files
        run: npm run sync-version
      - name: Sync lockfile package versions
        shell: python
        run: |
          import json
          from pathlib import Path

          package = json.loads(Path('package.json').read_text())
          version = package['version']

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text())
          lock['version'] = version
          lock['packages']['']['version'] = version
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          cargo_path = Path('src-tauri/Cargo.lock')
          cargo = cargo_path.read_text()
          marker = 'name = "arcscan"\nversion = "'
          start = cargo.index(marker) + len(marker)
          end = cargo.index('"', start)
          cargo = cargo[:start] + version + cargo[end:]
          cargo_path.write_text(cargo)
      - name: Verify version consistency
        run: npm run check-version
      - name: Remove one-shot workflow
        run: rm .github/workflows/release-sync-v1.8.7.yml
      - name: Commit synced release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync ArcScan v1.8.7 release metadata"
          git push
