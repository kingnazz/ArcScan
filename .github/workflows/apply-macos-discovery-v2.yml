name: Apply macOS discovery v2

on:
  push:
    branches:
      - fix/macos-local-discovery-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-local-discovery-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-macos-discovery-v2.mjs
      - name: Commit scanner fix
        run: |
          if git diff --quiet src-tauri/src/scanner.rs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/scanner.rs
          git commit -m "fix: make macOS LAN discovery numeric"
          git push origin HEAD:fix/macos-local-discovery-v2
