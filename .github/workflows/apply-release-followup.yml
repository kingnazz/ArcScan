name: Apply Release Follow-up

on:
  push:
    branches: ["release/v1.8.5"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.8.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply release wording
        run: node scripts/release-1.8.5-followup.mjs
      - name: Commit release wording
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Release wording is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md site/index.html
          git commit -m "docs: clarify v1.8.5 ArcAtlas privacy boundary"
          git push origin HEAD:release/v1.8.5
