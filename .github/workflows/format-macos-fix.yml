name: Format macOS scan fix

on:
  push:
    branches:
      - fix/macos-live-results-persist

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip fmt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-live-results-persist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/scanner.rs
          git commit -m "[skip fmt] Apply rustfmt to macOS scan fix"
          git push origin HEAD:fix/macos-live-results-persist
