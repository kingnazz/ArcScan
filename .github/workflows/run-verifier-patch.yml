name: Run verifier patch

on:
  push:
    branches:
      - release/v1.8.5

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.8.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-verify-site-1.8.5.mjs
      - name: Commit patch
        run: |
          if git diff --quiet scripts/verify-site.mjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-site.mjs
          git commit -m "test: update website verification for v1.8.5"
          git push origin HEAD:release/v1.8.5
