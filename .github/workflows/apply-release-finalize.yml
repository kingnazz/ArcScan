name: Apply v1.8.5 Finalize

on:
  push:
    branches: ["release/v1.8.5"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.8.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply release finalization
        run: node scripts/finalize-release-1.8.5.mjs
      - name: Verify version consistency
        run: npm run check-version
      - name: Commit final release metadata
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Release finalization is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml CHANGELOG.md docs/RELEASE-NOTES-1.8.5.md package-lock.json site/index.html site/sitemap.xml site/whats-new-1.8.5.html src-tauri/Cargo.lock
          git commit -m "docs: finalize ArcScan v1.8.5 release"
          git push origin HEAD:release/v1.8.5
