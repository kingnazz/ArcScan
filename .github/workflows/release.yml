name: Publish Release

# Manually publish a SIGNED release with installers + the auto-updater manifest
# (latest.json) for all platforms. Actions tab -> "Publish Release" -> Run
# workflow. The version/tag is read automatically from package.json, so it
# always matches the built app — just bump the version, commit, and run.
#
# This repo is public, so the in-app updater reads this repo's own Releases
# feed directly — no separate repo or PAT needed. See docs/AUTO_UPDATE.md.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           - updater private key (from tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  - its password ("" if none)

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            label: ArcScan-windows-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            bundles: nsis
            label: ArcScan-windows-arm64
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app dmg
            label: ArcScan-macos-universal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Build signed installers + updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/updater.conf.json
      - name: Collect installers + signatures
        shell: bash
        run: |
          mkdir -p artifacts
          base="src-tauri/target/${{ matrix.target }}/release/bundle"
          for pattern in '*.msi' '*-setup.exe' '*.dmg' '*.app.tar.gz' '*.sig'; do
            find "$base" -name "$pattern" -exec cp {} artifacts/ \; 2>/dev/null || true
          done
          ls -la artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish release + updater manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read version from package.json
        id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: staged
      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p dist
          find staged -type f -exec cp {} dist/ \;
          ls -la dist
      - name: Generate latest.json (updater manifest)
        run: node scripts/gen-latest-json.mjs "${{ steps.ver.outputs.tag }}" "${{ github.repository }}" dist
      - name: Publish signed release + manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ArcScan ${{ steps.ver.outputs.tag }}
          files: dist/*
          draft: false
          make_latest: "true"
          generate_release_notes: true
