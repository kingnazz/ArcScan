name: Publish Release

# Manually publish a release with installers for all platforms — no local tag
# pushing needed. Actions tab -> "Publish Release" -> Run workflow -> pick a
# version. Produces a draft GitHub Release with the Windows x64/ARM64 and macOS
# universal installers attached.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.3.0)"
        required: true
        default: "v1.3.0"

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: msi nsis
            label: ArcScan-windows-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            bundles: msi nsis
            label: ArcScan-windows-arm64
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
            label: ArcScan-macos-universal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Build installers
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p artifacts
          base="src-tauri/target/${{ matrix.target }}/release/bundle"
          for pattern in '*.msi' '*-setup.exe' '*.dmg'; do
            find "$base" -name "$pattern" -exec cp {} artifacts/ \; 2>/dev/null || true
          done
          ls -la artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ArcScan ${{ github.event.inputs.version }}
          files: dist-artifacts/**/*
          draft: true
          generate_release_notes: true
