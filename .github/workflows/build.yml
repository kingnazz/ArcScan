name: Build Windows Installers

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            label: ArcScan-windows-x64
          - target: aarch64-pc-windows-msvc
            label: ArcScan-windows-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # windows-latest ships the MSVC ARM64 cross tools, so both targets
          # build on the same hosted runner — no dedicated ARM runner needed.
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installers (MSI + NSIS)
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles msi nsis

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p artifacts
          base="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$base/msi" -name '*.msi' -exec cp {} artifacts/ \; 2>/dev/null || true
          find "$base/nsis" -name '*-setup.exe' -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -la artifacts

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Attach installers to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          draft: true
          generate_release_notes: true
