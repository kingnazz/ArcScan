name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A pull request that supersedes another cancels its run rather than queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The version lives in package.json and is propagated by
      # scripts/sync-version.mjs. This fails the build when a bump missed a file,
      # so the installer, the in-app version and the website cannot disagree.
      - name: Check the version is consistent everywhere
        run: npm run check-version

      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium
      - name: Install the browser-test helpers
        run: npm i --no-save playwright @axe-core/playwright

      - name: Build
        run: npm run build
      # The demo backend runs entirely in the browser, so the preview server is
      # all the suite needs: no Rust build and no real network access.
      - name: Serve the built app
        run: npm run preview &
      - name: Wait for the preview server
        run: npx --yes wait-on http://localhost:4173/ --timeout 60000
      - name: Verify the interface
        run: node scripts/verify-ui.mjs

  backend:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # An advisory can be published against a dependency at any moment, so a new
    # one must not block an unrelated pull request. The job still reports it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
