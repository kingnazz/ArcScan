name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A pull request that supersedes another cancels its run rather than queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The version lives in package.json and is propagated by
      # scripts/sync-version.mjs. This fails the build when a bump missed a file,
      # so the installer, the in-app version and the website cannot disagree.
      - name: Check the version is consistent everywhere
        run: npm run check-version

      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium
      - name: Install the browser-test helpers
        run: npm i --no-save playwright @axe-core/playwright

      - name: Build
        run: npm run build
      # The demo backend runs entirely in the browser, so the preview server is
      # all the suite needs: no Rust build and no real network access.
      - name: Serve the built app
        run: npm run preview &
      - name: Wait for the preview server
        run: npx --yes wait-on http://localhost:4173/ --timeout 60000
      - name: Verify the interface
        run: node scripts/verify-ui.mjs
      # A policy that is too strict breaks the packaged app while leaving the
      # preview (which serves no policy) working, so it is checked explicitly.
      - name: Verify the Content Security Policy
        run: node scripts/verify-csp.mjs

      # The marketing site is plain static files with no build step, so it only
      # needs a static server. It carries the version, the download logic and
      # the product claims, none of which were covered by CI before.
      - name: Serve the marketing site
        run: npx --yes serve site -l 4174 > /dev/null 2>&1 &
      - name: Wait for the site server
        run: npx --yes wait-on http://localhost:4174/ --timeout 60000
      - name: Verify the marketing site
        run: node scripts/verify-site.mjs

  backend:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The portable edition is a different binary: no updater plugin, a
      # different capability set, and the portable startup path compiled in. It
      # has to be built and tested in its own right, or "it compiles" would only
      # ever have been checked for the installed half.
      #
      # Its own target directory, so this does not evict the installed build's
      # cache on every run.
      - name: Test the portable edition
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: target-portable
        run: cargo test --no-default-features --features portable
      - name: Clippy the portable edition
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: target-portable
        run: cargo clippy --all-targets --no-default-features --features portable -- -D warnings

      # Enabling both edition features would compile a binary that reports
      # portable while carrying the installer updater. Cargo.toml makes that a
      # compile error; this checks the guard is actually wired, because a guard
      # nobody tests is a comment.
      - name: The two editions cannot be combined
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: target-portable
        run: |
          if cargo check --features portable 2>err.log; then
            echo "expected a compile error when both editions are enabled"
            exit 1
          fi
          grep -q "mutually exclusive" err.log || {
            echo "the build failed, but not with the mutual-exclusion error:"
            cat err.log
            exit 1
          }
          echo "Enabling both editions fails to compile, as intended."

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # High/critical npm advisories and Rust security advisories are release
    # blockers. `cargo audit` still leaves its informational warning categories
    # informational; only actionable security advisories fail its default run.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
