name: Apply v1.8.6 release prep

on:
  push:
    branches:
      - release/v1.8.6

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.8.6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-release-1.8.6.mjs
      - name: Commit release prep
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json site/index.html site/privacy.html CHANGELOG.md scripts/verify-site.mjs
          git commit -m "release: prepare ArcScan v1.8.6"
          git push origin HEAD:release/v1.8.6
