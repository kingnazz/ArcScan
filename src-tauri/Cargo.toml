[package]
name = "arcscan"
version = "1.3.3"
description = "A fast, lightweight network and port scanner"
authors = ["ArcScan"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows.
name = "arcscan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "process"] }
futures = "0.3"

rusqlite = { version = "0.32", features = ["bundled"] }
dns-lookup = "2"
chrono = { version = "0.4", features = ["serde"] }
if-addrs = "0.13"

[features]
# This feature is used for production builds or when a dev server is not specified.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
