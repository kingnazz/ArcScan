[package]
name = "arcscan"
version = "1.8.5"
description = "A fast, lightweight network and port scanner"
authors = ["ArcScan"]
license = "MIT"
edition = "2021"
rust-version = "1.89"

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows.
name = "arcscan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }

tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "process"] }
futures = "0.3"

rusqlite = { version = "0.32", features = ["bundled"] }
dns-lookup = "2"
# Parsing an SSDP LOCATION, which is hostile input. Already in the dependency
# graph via tauri, so this adds no code to the build — and a battle-tested URL
# parser is exactly what should be deciding whether `http://0x7f.0.0.1/` is
# loopback, rather than anything hand-rolled here.
url = "2"
chrono = { version = "0.4", features = ["serde"] }
if-addrs = "0.13"

# MessageBoxW reports a failed Portable temporary-session startup before any
# window exists to report it in. `windows-sys` is already in Tauri's dependency
# graph; this direct entry only enables the declaration ArcScan calls.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# Desktop-only auto-updater (checks a public feed, verifies signatures, installs
# and relaunches). Not built for mobile targets, and -- see the `portable`
# feature below -- not built for portable ones either.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

[features]
default = ["installed-updater"]

# This feature is used for production builds or when a dev server is not specified.
custom-protocol = ["tauri/custom-protocol"]

# The installed edition's auto-updater: check the signed feed, download, install,
# relaunch. Default on, so `cargo build` and `cargo test` behave exactly as they
# did before 1.8.4.
installed-updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

# The Windows Portable edition.
#
# Two things at once, and both matter. It moves ArcScan-owned state into one
# disposable system-temp session per process, and it takes the installer updater
# out of the binary rather than hiding its button: build with
# `--no-default-features --features portable` and there is no
# tauri-plugin-updater linked, so no install-and-relaunch path exists to be
# reached by a bug, a stale build of the frontend, or anything else.
#
# The edition is compiled in on purpose. See src/runtime.rs for why inferring it
# from the folder at runtime would be a silent data-location change waiting to
# happen.
portable = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
